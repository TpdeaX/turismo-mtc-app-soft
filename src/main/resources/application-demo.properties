# =====================================================================
#  Perfil DEMO - Base de datos H2 en memoria
#  Uso: mvn spring-boot:run -Dspring-boot.run.profiles=demo
#  Consola H2: http://localhost:8081/h2-console  (JDBC: jdbc:h2:mem:turismo)
# =====================================================================
spring.datasource.url=jdbc:h2:mem:turismo;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
