# =====================================================================
#  Plataforma de Zonas Turisticas - MTC
#  Perfil por defecto: MySQL 8
#  Perfil alternativo : --spring.profiles.active=demo  (H2 en memoria)
# =====================================================================
spring.application.name=turismo-mtc
server.port=8081
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# --- Base de datos MySQL -------------------------------------------------
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:turismo_mtc}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate -----------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=America/Lima

# Respeta literalmente los nombres de @Table y @Column. Sin esto, Hibernate
# convierte "EstCodigo" en "est_codigo" y el modelo fisico dejaria de coincidir
# con el diccionario de datos del informe (seccion 2.4).
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# --- Resolucion de vistas JSP -------------------------------------------
spring.mvc.view.prefix=/views/
spring.mvc.view.suffix=.jsp
spring.web.resources.static-locations=classpath:/static/,/assets/

# --- RF10 / RF11 / RNF02 / RNF05: integracion periodica ------------------
# Modo de las fuentes externas: SIMULADO (dataset local) | REMOTO
app.integracion.modo=SIMULADO
# Cron de sincronizacion diaria (03:00 hora de Lima). RNF02: minimo 1 vez al dia
app.integracion.cron=0 0 3 * * *
# Sincronizar tambien al arrancar la plataforma
app.integracion.sincronizar-al-inicio=true
# Dias de pronostico que conserva el sistema por estacion
app.integracion.dias-pronostico=5

# --- RN01 / RN04: parametros del motor de rutas caminables ---------------
app.ruta.velocidad-caminata-kmh=4.2
app.ruta.distancia-maxima-km=25

# --- Sesion --------------------------------------------------------------
server.servlet.session.timeout=60m

# --- Logging -------------------------------------------------------------
logging.level.org.springframework=INFO
logging.level.com.zonasturisticas=DEBUG
logging.level.org.hibernate.SQL=WARN
